<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="200px" height="100px">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%">
			<style>
			
                :root {
                    --color-1: #000000;
                    --color-2: #0a0a0a;
                    --color-3: #141414;
                    --color-text: #ffffff;
                    --color-accent: #00ff00;
                    --color-accent-light: #00ff88;
                    --color-accent-dark: #00cc00;
                    --color-border: #ffffff;
                    --color-secondary: #ff00ff;
                }

			                *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}:root,*,*::before,*::after{font-family:"Courier New",Courier,monospace,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji"}ul,li{list-style-type:none}main{padding:1rem;text-align:center;width:100%;height:100%;color:var(--color-text);display:grid;place-items:center;gap:2rem}.cls-1{fill:var(--color-text)}.cls-2{fill:none;stroke-linecap:square;stroke-linejoin:miter;stroke-width:4px;stroke:var(--color-accent)}.links{display:flex;justify-content:center;gap:1rem}.links .link{display:flex;align-items:center}.links .link a{text-decoration:none;font-weight:bold;color:var(--color-text)}.links .link .link-logo svg{display:block;fill:var(--color-text)}.links .link-icon{color:var(--color-text)}main>*{--anim-index:0;--anim-stagger:.4s;animation-name:reveal;animation-duration:1s;animation-timing-function:steps(5, end);animation-fill-mode:forwards;animation-delay:calc(var(--anim-stagger, 1s) * var(--anim-index, 0));opacity:0;transform:translateY(-10px)}@keyframes reveal{0%{opacity:0}20%{opacity:0}40%{opacity:0}60%{opacity:0}80%{opacity:0}100%{opacity:1}}main{padding:0rem;display:block}.container{padding:1.5rem;border:4px solid var(--color-border);background:var(--color-2);--anim-index:5}.links{display:flex;justify-content:center;gap:1rem}.link{display:flex;align-items:center;gap:1rem;border:3px solid var(--color-secondary);padding:1rem 1.5rem;background:var(--color-3);text-decoration:none}.link a{text-decoration:none;font-weight:900;font-size:1.2rem;text-transform:uppercase;letter-spacing:2px;color:var(--color-text)}.link-logo svg{display:block;width:32px;height:32px}.link-icon{font-size:1.5rem;color:var(--color-secondary);font-weight:900}
			</style>
			<main class="main">
	<div class="container">
		<div class="links">
			<div class="link">
				<div class="link-logo">
					<svg
						id="Layer_1"
						data-name="Layer 1"
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 490 315"
						width="30px"
						height="30px"
					>
						<rect
							id="rect-back"
							style="mask: url(#animated-mask)"
							width="100%"
							height="100%"
							stroke-width="0"
						></rect>
						<defs>
							<linearGradient
								x1="0%"
								y1="50%"
								x2="100%"
								y2="100%"
								id="Gradient1"
							>
								<stop class="stop1" offset="0%"></stop>
								<stop class="stop2" offset="50%"></stop>
								<stop class="stop3" offset="100%"></stop>
							</linearGradient>
						</defs>
						<mask id="animated-mask">
							<polyline
								id="lf"
								class="cls-1"
								points="10 10 10 310 119 310 119 160 119 10 193 10"
							></polyline>
							<line
								id="dash"
								class="cls-1"
								x1="119"
								y1="160"
								x2="156"
								y2="160"
							></line>
							<polyline
								id="M"
								class="cls-1"
								points="338,10 265,160 265,160 193,10 120,309 "
							></polyline>
							<polyline
								id="V"
								class="cls-1"
								points="338 10 410 309 482 10"
							></polyline>
							<polyline
								class="cls-2"
								id="hill"
								points="385.54 310 329.26 88.93 329.19 88.92 265.75 220.54 265.68 220.54 202.25 88.92 202.18 88.93 145.9 310 385.54 310"
							></polyline>
						</mask>
						<style>
							#rect-back {
								fill: url(#Gradient1);
							}
							.cls-1,
							.cls-2 {
								stroke-linecap: round;
								stroke-linejoin: round;
								stroke-width: 15px;
								fill: none;
								stroke: white;
							}
							.cls-2 {
								stroke-width: 5px;
								fill: white;
							}
							.stop1 {
								stop-color: var(--color-text);
							}
							.stop2 {
								stop-color: var(--color-text);
							}
							.stop3 {
								stop-color: var(--color-text);
							}
						</style>
					</svg>
				</div>
				<a href="lastfm-viewer.vercel.app" target="_blank"
					>@lastfm-viewer</a
				>
				<div class="link-icon">↗</div>
			</div>
		</div>
	</div>
</main>

		</div>
	</foreignObject>
</svg>