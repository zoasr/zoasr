<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="100%" height="24px">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%">
			<style>
			
				/* Hallmark · v2.0.0 · Ember file view · light: warm ink on GitHub paper, burnt-orange signal · the contribution grid carries the colour */
				:root {
					--color-ink: oklch(23.5% 0.015 48.1);
					--color-ink-2: oklch(36.9% 0.023 48.1);
					--color-muted: oklch(48.4% 0.025 51.2);
					--color-accent: oklch(51.8% 0.163 36.9);
					--color-focus: oklch(51.8% 0.163 36.9);
					--color-dot-0: oklch(94% 0.009 62.6);
					--color-dot-1: oklch(88.8% 0.048 51.6);
					--color-dot-2: oklch(77.1% 0.103 52.4);
					--color-dot-3: oklch(63.5% 0.154 45.9);
					--color-dot-4: oklch(51.8% 0.163 36.9);
					--font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
					--text-meta: 12px;
					--text-body: 14px;
					--text-name: 18px;
					--text-intro: 22px;
					--space-2xs: 4px;
					--space-xs: 8px;
					--space-sm: 12px;
					--space-md: 16px;
					--space-lg: 28px;
					--space-xl: 56px;
					--radius-dot: 2px;
					--dur-settle: 700ms;
					--dur-column: 900ms;
					--ease-out: cubic-bezier(0.23, 1, 0.32, 1);
					--stagger-settle: 90ms;
					--stagger-column: 18ms;
				}

							*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}:root,*,*::before,*::after{font-family:var(--font-body)}html,body{overflow-x:clip}main{position:relative;width:100%;height:100%;color:var(--color-ink);background:transparent;overflow:clip}.page{display:flex;flex-direction:column;width:100%;height:100%;padding:0 var(--space-lg)}p{font-size:var(--text-body);line-height:1.5}b{font-weight:600}a{color:var(--color-accent);text-decoration:none}a:focus-visible,:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}::selection{background:var(--color-accent);color:var(--color-ink)}.settle{animation:settle var(--dur-settle) var(--ease-out) both;animation-delay:var(--delay, 0ms)}@keyframes settle{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}.topbar-page{justify-content:center}.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:var(--space-sm);font-size:var(--text-meta);color:var(--color-muted);white-space:nowrap}.topbar b{color:var(--color-ink)}.count{text-align:center;font-variant-numeric:tabular-nums}.file{text-align:right}@media (max-width: 520px){.topbar{grid-template-columns:1fr auto}.file{display:none}}
			</style>
			<main class="page topbar-page">
	<div class="topbar">
		<p class="crumb"><b>zoasr</b> / readme.md</p>
		<p class="count">since 2018</p>
		<p class="file">readme.md</p>
	</div>
</main>

		</div>
	</foreignObject>
</svg>