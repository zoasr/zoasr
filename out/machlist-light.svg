<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="200px" height="100px">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%">
			<style>
			
                :root {
                    --color-1: #ffffff;
                    --color-2: #e8e8e8;
                    --color-3: #d4d4d4;
                    --color-text: #000000;
                    --color-accent: #00ff00;
                    --color-accent-light: #00ff88;
                    --color-accent-dark: #00cc00;
                    --color-border: #000000;
                    --color-secondary: #ff00ff;
                }

			                *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}:root,*,*::before,*::after{font-family:"Courier New",Courier,monospace,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji"}ul,li{list-style-type:none}main{padding:1rem;text-align:center;width:100%;height:100%;color:var(--color-text);display:grid;place-items:center;gap:2rem}.cls-1{fill:var(--color-text)}.cls-2{fill:none;stroke-linecap:square;stroke-linejoin:miter;stroke-width:4px;stroke:var(--color-accent)}.links{display:flex;justify-content:center;gap:1rem}.links .link{display:flex;align-items:center}.links .link a{text-decoration:none;font-weight:bold;color:var(--color-text)}.links .link .link-logo svg{display:block;fill:var(--color-text)}.links .link-icon{color:var(--color-text)}main>*{--anim-index:0;--anim-stagger:.4s;animation-name:reveal;animation-duration:1s;animation-timing-function:steps(5, end);animation-fill-mode:forwards;animation-delay:calc(var(--anim-stagger, 1s) * var(--anim-index, 0));opacity:0;transform:translateY(-10px)}@keyframes reveal{0%{opacity:0}20%{opacity:0}40%{opacity:0}60%{opacity:0}80%{opacity:0}100%{opacity:1}}main{padding:0rem;display:block}.container{padding:1.5rem;border:4px solid var(--color-border);background:var(--color-2);--anim-index:5}.links{display:flex;justify-content:center;gap:1rem}.link{display:flex;align-items:center;gap:1rem;border:3px solid var(--color-accent);padding:1rem 1.5rem;background:var(--color-3);text-decoration:none}.link a{text-decoration:none;font-weight:900;font-size:1.2rem;text-transform:uppercase;letter-spacing:2px;color:var(--color-text)}.link-logo svg{display:block;width:32px;height:32px;filter:brightness(0) saturate(100%)}.link-icon{font-size:1.5rem;color:var(--color-accent);font-weight:900}
			</style>
			<main class="main">
	<div class="container">
		<div class="links">
			<div class="link">
				<div class="link-logo">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						xmlns:xlink="http://www.w3.org/1999/xlink"
						viewBox="0 0 300 300"
						width="30px"
						height="30px"
					>
						<path
							class="cls-1"
							d="m253.88,238.88c-12,0-21.38-1.88-28.12-5.62s-11.46-9.58-14.12-17.5c-2.67-7.91-4-18.12-4-30.62v-96.25l-62.5,138.75h-5L75.12,86.38v141.25h-10V62.63h23.75l60,130,58.75-130h22.5v122.5c0,15.17,1.91,27.09,5.75,35.75,3.83,8.66,9.83,13,18,13v5Z"
						/>
					</svg>
				</div>
				<a href="machlist.vercel.app" target="_blank">Machlist</a>
				<div class="link-icon">↗</div>
			</div>
		</div>
	</div>
</main>

		</div>
	</foreignObject>
</svg>