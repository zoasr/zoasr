<svg xmlns="http://www.w3.org/2000/svg" fill="none" width="100%" height="700px">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%">
			<style>
			
                :root {
                    --color-1: #000000;
                    --color-2: #0a0a0a;
                    --color-3: #141414;
                    --color-text: #ffffff;
                    --color-accent: #00ff00;
                    --color-accent-light: #00ff88;
                    --color-accent-dark: #00cc00;
                    --color-border: #ffffff;
                    --color-secondary: #ff00ff;
                }

			                *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}:root,*,*::before,*::after{font-family:"Courier New",Courier,monospace,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji"}ul,li{list-style-type:none}main{padding:1rem;text-align:center;width:100%;height:100%;color:var(--color-text);display:grid;place-items:center;gap:2rem}.cls-1{fill:var(--color-text)}.cls-2{fill:none;stroke-linecap:square;stroke-linejoin:miter;stroke-width:4px;stroke:var(--color-accent)}.links{display:flex;justify-content:center;gap:1rem}.links .link{display:flex;align-items:center}.links .link a{text-decoration:none;font-weight:bold;color:var(--color-text)}.links .link .link-logo svg{display:block;fill:var(--color-text)}.links .link-icon{color:var(--color-text)}main>*{--anim-index:0;--anim-stagger:.4s;animation-name:reveal;animation-duration:1s;animation-timing-function:steps(5, end);animation-fill-mode:forwards;animation-delay:calc(var(--anim-stagger, 1s) * var(--anim-index, 0));opacity:0;transform:translateY(-10px)}@keyframes reveal{0%{opacity:0}20%{opacity:0}40%{opacity:0}60%{opacity:0}80%{opacity:0}100%{opacity:1}}.pixel-container{position:relative;border:4px solid var(--color-border);background:var(--color-1);image-rendering:pixelated;image-rendering:crisp-edges}.pixel-grid{background-image:linear-gradient(var(--color-border) 1px, transparent 1px),linear-gradient(90deg, var(--color-border) 1px, transparent 1px);background-size:8px 8px;background-position:0 0;opacity:.1;animation:gridMove 20s linear infinite}@keyframes gridMove{0%{background-position:0 0}100%{background-position:8px 8px}}.pixel-squares{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}.pixel-square{position:absolute;background:var(--color-accent);animation:float 8s ease-in-out infinite}.pixel-square:nth-child(1){width:16px;height:16px;top:10%;left:15%;animation-delay:0s}.pixel-square:nth-child(2){width:24px;height:24px;top:25%;right:20%;animation-delay:2s;background:var(--color-secondary)}.pixel-square:nth-child(3){width:12px;height:12px;bottom:30%;left:25%;animation-delay:4s}.pixel-square:nth-child(4){width:20px;height:20px;bottom:15%;right:30%;animation-delay:6s;background:var(--color-accent-light)}@keyframes float{0%,100%{transform:translateY(0);opacity:.8}50%{transform:translateY(-20px);opacity:.4}}.hero{text-align:center;z-index:1;position:relative;padding:2rem;--anim-index:2}.main-title{font-size:clamp(3rem, 6vw, 5rem);font-weight:900;margin-bottom:1.5rem;text-transform:uppercase;letter-spacing:4px;color:var(--color-text);border:4px solid var(--color-accent);padding:.5rem 1rem;background:var(--color-2);display:inline-block;text-shadow:4px 4px 0 var(--color-border),-2px -2px 0 var(--color-border)}.subtitle{font-size:clamp(1.2rem, 3vw, 1.8rem);max-width:700px;margin:0 auto;line-height:1.4;color:var(--color-text);border:3px solid var(--color-secondary);padding:1rem;background:var(--color-2);text-transform:uppercase;letter-spacing:2px}.skills{z-index:1;position:relative;padding:2rem;--anim-index:3}.skills-title{font-size:clamp(1.8rem, 4vw, 2.5rem);text-align:center;margin-bottom:3rem;text-transform:uppercase;letter-spacing:3px;font-weight:900;color:var(--color-accent);border:4px solid var(--color-border);padding:.5rem 1rem;background:var(--color-text);display:inline-block}.tech-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:2rem;max-width:900px;margin:0 auto}.tech-category{border:4px solid var(--color-border);background:var(--color-2);padding:1.5rem;position:relative}.tech-category::before{content:"";position:absolute;top:0;left:0;width:8px;height:8px;background:var(--color-accent)}.tech-category::after{content:"";position:absolute;bottom:0;right:0;width:8px;height:8px;background:var(--color-accent)}.category-label{font-size:1.3rem;margin-bottom:1.5rem;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:var(--color-secondary);border-bottom:4px solid var(--color-border);padding-bottom:.5rem}.tech-badges{display:flex;justify-content:center;flex-wrap:wrap;gap:1rem}.tech-badge{display:inline-block;padding:.75rem 1.25rem;font-size:1rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--color-text);border:3px solid var(--color-border);background:var(--color-3)}.tech-badge.frontend{background:var(--color-accent);color:var(--color-border)}.tech-badge.styling{background:var(--color-secondary);color:var(--color-border)}.tech-badge.framework{background:var(--color-accent-light);color:var(--color-border)}@media (max-width: 768px){.container{padding:1rem;gap:3rem}.tech-grid{grid-template-columns:1fr;gap:1.5rem}.tech-category{padding:1.25rem}.main-title{font-size:clamp(2rem, 5vw, 3.5rem);letter-spacing:2px}.skills-title{font-size:clamp(1.5rem, 3.5vw, 2rem);letter-spacing:2px}}@media (max-width: 480px){.tech-badges{gap:.75rem}.tech-badge{font-size:.9rem;padding:.5rem 1rem;letter-spacing:0}.pixel-square{display:none}}
			</style>
			<main class="main">
    <div class="pixel-container">
        <div class="pixel-grid"></div>
        <div class="pixel-squares">
            <div class="pixel-square"></div>
            <div class="pixel-square"></div>
            <div class="pixel-square"></div>
            <div class="pixel-square"></div>
        </div>
        
        <header class="hero">
            <h1 class="main-title">Hi, I'm zoasr</h1>
            <p class="subtitle">
                I design, build and animate web applications and websites
            </p>
        </header>

        <section class="skills">
            <h2 class="skills-title">What I work with:</h2>

            <div class="tech-grid">
                <div class="tech-category">
                    <h3 class="category-label">Frontend</h3>
                    <div class="tech-badges">
                        <span class="tech-badge frontend">HTML</span>
                        <span class="tech-badge frontend">CSS</span>
                        <span class="tech-badge frontend">JavaScript</span>
                    </div>
                </div>

                <div class="tech-category">
                    <h3 class="category-label">Styling</h3>
                    <div class="tech-badges">
                        <span class="tech-badge styling">Tailwind</span>
                        <span class="tech-badge styling">Sass</span>
                    </div>
                </div>

                <div class="tech-category">
                    <h3 class="category-label">Frameworks</h3>
                    <div class="tech-badges">
                        <span class="tech-badge framework">React</span>
                        <span class="tech-badge framework">Next.js</span>
                        <span class="tech-badge framework">Astro</span>
                        <span class="tech-badge framework">Svelte</span>
                        <span class="tech-badge framework">Solid</span>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

		</div>
	</foreignObject>
</svg>